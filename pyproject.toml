[project]
name = "deepgate-facerec"
version = "0.1.0"
description = "Deep Neural Networks Homework: Face Recognition via Siamese/Triplet Embedding Learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Course Instructor / Team" }
]
keywords = [
    "deep-learning",
    "siamese-networks",
    "triplet-loss",
    "metric-learning",
    "face-recognition",
    "pytorch",
    "education"
]
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
notebooks = [
    "jupyterlab>=4.1.0",
    "ipywidgets>=8.1.0",
    "umap-learn>=0.5.5",
]

[dependency-groups]
dev = [
    "commitizen>=4.8.2",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.12.20241230",
    "types-pillow>=10.2.0.20240822",
    "types-tqdm>=4.66.0.20240417",
]

# ================================= RUFF
[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D202", # No blank lines allowed after function docstring
    "D212", # Multi-line docstring summary should start at the first line
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["deepgate"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ================================= MYPY
[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

# ================================= COMMITIZEN
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true

# ================================= PYTEST
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v"
